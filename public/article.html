<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app" class="max-w-3xl mx-auto px-4 py-10"></div>
  <script>
    const supabaseUrl = 'https://utgeiuddfswnkjcbqktg.supabase.co';
    const supabaseKey = 'sb_publishable_GE5QLsQUmLoeoa2iBeoktQ_wpIQG96f';
    const client = supabase.createClient(supabaseUrl, supabaseKey);
    
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    
    async function loadArticle() {
      if (!id) {
        document.getElementById('app').innerHTML = '<p class="text-center text-gray-500 mt-20">文章ID缺失</p>';
        return;
      }
      const { data, error } = await client.from('articles').select('*').eq('id', id).single();
      if (error || !data) {
        document.getElementById('app').innerHTML = '<p class="text-center text-gray-500 mt-20">文章未找到</p>';
        return;
      }
      document.title = data.title + ' - 量化实验室';
      document.getElementById('app').innerHTML = `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8">
          <h1 class="text-3xl font-bold text-gray-800 mb-4">${data.title}</h1>
          <div class="flex items-center gap-4 text-sm text-gray-500 mb-6">
            <span><i class="far fa-user mr-1"></i>${data.author}</span>
            <span><i class="far fa-calendar mr-1"></i>${new Date(data.published_at).toLocaleDateString()}</span>
          </div>
          ${data.cover_url ? `<img src="${data.cover_url}" alt="${data.title}" class="w-full rounded-xl mb-6" />` : ''}
          <div class="prose max-w-none text-gray-700 leading-relaxed whitespace-pre-wrap">${data.content}</div>
          <div class="mt-8 pt-6 border-t border-gray-200">
            <a href="/" class="text-red-600 hover:underline inline-flex items-center gap-1"><i class="fas fa-arrow-left text-xs"></i>返回首页</a>
          </div>
        </div>
      `;
    }
    loadArticle();
  </script>
</body>
</html>
